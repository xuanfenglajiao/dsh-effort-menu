name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check client syntax
        run: node --check client.js
      - name: Check host syntax
        run: node --check index.js
      - name: Check manifest
        run: node scripts/check-manifest.mjs
